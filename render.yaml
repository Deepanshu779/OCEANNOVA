services:
  - type: web
    name: oceannova-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oceannova-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: oceannova-db
    databaseName: oceannova
    user: oceannova
