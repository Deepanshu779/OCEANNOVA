services:
  - type: web
    name: oceannova-api
    runtime: python
    # Deploy from the repository root so the backend can access the committed
    # data/processed/all_scenes/* Radar_data results for every investigation.
    rootDir: ""
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    # Liveness is intentionally database-independent. /api/v1/ready is the
    # dependency/readiness diagnostic endpoint.
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
