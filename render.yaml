services:
  - type: web
    name: oceannova-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Never run database seeding before the web process starts. A transient
    # Postgres outage must not prevent the FastAPI process from binding its port.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness is intentionally database-independent. /api/v1/ready is the
    # dependency/readiness diagnostic endpoint.
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
